name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulation/requirements.txt
      - run: pip install -r simulation/requirements.txt flake8
      - run: flake8 simulation --max-line-length=120 --select=E9,F63,F7,F82
      - run: pytest -q
        working-directory: simulation

  firmware-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native trigger-logic tests
        run: |
          g++ -std=c++11 -Wall -Wextra -o /tmp/test_logic firmware/test/test_trigger_logic.cpp
          /tmp/test_logic

  firmware-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          sketch-paths: |
            - firmware/autoshield
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: DHT sensor library
            - name: Adafruit Unified Sensor
            - name: Adafruit BMP280 Library
            - name: Adafruit BusIO
